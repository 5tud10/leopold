.pz-acts{display:grid;justify-items:start;gap:2px;margin-top:26px}
.pz-note{font-size:.875rem;line-height:1.4;max-width:32ch;margin:2px 0 12px;color:#4F5668}
.pz-acts button,.pz-acts a{font:500 1rem/1 "Conduit ITC",sans-serif;text-decoration:underline;text-underline-offset:4px}
.phone{position:relative;width:390px;height:844px;border-radius:56px;background:#fff;overflow:hidden;box-shadow:0 0 0 11px #1a1a1c,0 0 0 13px #3a3a3e,0 40px 80px rgba(0,0,0,.25);display:flex;flex-direction:column}
.sb{position:relative;flex:none;height:46px;background:var(--sb,#E2DED5);display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 44px;color:#1C2434;transition:background .4s}
.sb-t{font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sb-i{display:flex;gap:6px;align-items:center}.sb-i svg{height:12px;width:auto;fill:currentColor}
.phone iframe{flex:1;width:100%;border:0;display:block;background:#fff}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1C2434;opacity:.85;pointer-events:none}
@media (max-width:860px){.pz{grid-template-columns:1fr;justify-items:center}.pz-side{max-width:390px}}
@media (max-width:500px){.pz{padding:0;gap:0}.pz-side{display:none}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.home-ind{display:none}}
</style>
<script>
(() => {
  const fr = document.querySelector("[data-frame]"), sb = document.querySelector("[data-sb]"), st = document.querySelector("[data-sbt]");
  const tick = () => { st.textContent = new Intl.DateTimeFormat("de-AT", { timeZone: "Europe/Vienna", hour: "2-digit", minute: "2-digit" }).format(new Date()); };
  tick(); setInterval(tick, 15000);
  // Statusleiste = Kopffarbe der geladenen Seite (auch bei offenem Menü)
  function sync() { try { const d = fr.contentDocument; if (!d) return; const st = getComputedStyle(d.documentElement), mo = d.querySelector("#menu[open]"); const c = (mo ? st.getPropertyValue("--stone") : (st.getPropertyValue("--hbg-now") || st.getPropertyValue("--stone"))).trim(); const fg = !mo && d.documentElement.classList.contains("xpage") ? st.getPropertyValue("--hfg").trim() : "#1C2434"; sb.style.color = fg; if (c) sb.style.setProperty("--sb", c); } catch (e) {} }
  fr.addEventListener("load", () => { sync(); try { const p = fr.contentWindow.location.pathname.split("/").pop() || "startseite.html"; document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === p))); } catch (e) {} });
  setInterval(sync, 600);
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { fr.src = b.dataset.p; }));
  document.querySelector("[data-reload]").addEventListener("click", () => { try { fr.contentWindow.location.reload(); } catch (e) { fr.src = fr.src; } });
})();
</script>
</body></html>
