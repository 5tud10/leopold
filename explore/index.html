<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leopold Explore</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --yellow: #fbf1b0;
    /* section colours: pastels at one chroma (OKLCH .06), hues 40° apart, lightest tone the screen can show */
    --peach: #ffd7b9; --rose: #ffcac9; --sky: #b7edfe; --blue: #c0d8ff; --pink: #fed3ef; --mint: #c3fcf0; --lilac: #e2d4ff; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--white); color: var(--black);
    font: 9px/1.4 var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  a { color: inherit; text-decoration: none; }

  .view { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .view.dragging { cursor: grabbing; }
  .field { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .field.ease { transition: transform .6s cubic-bezier(.6, 0, .2, 1); }
  .item { position: absolute; left: 0; top: 0; transition: transform .5s cubic-bezier(.6, 0, .2, 1), opacity .3s; }
  .item[hidden] { display: none; }
  .item img { display: block; width: 100%; height: 100%; object-fit: cover; background: #ececea; -webkit-user-drag: none; user-select: none; }
  .tilt { position: relative; width: 100%; height: 100%; transition: transform .35s ease-out; }
  .item .txt { position: absolute; top: 100%; left: 0; width: 100%; padding-top: 6px; transition: opacity .3s; }
  .item .k { opacity: .5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item h2 { font: 15px/1.15 var(--font); letter-spacing: -0.03em; margin: 3px 0 4px; }
  .item .x { text-transform: none; font-size: 10px; line-height: 1.35; letter-spacing: 0; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .card { width: 100%; height: 100%; border: 1px solid var(--black); padding: 12px; display: flex; align-items: flex-end;
    font: 22px/1.1 var(--font); letter-spacing: -0.03em; background: var(--white); }
  /* Overview (scale .23): category + title only, sized to stay ~8–9px on screen */
  body[data-step="2"] .item .txt { width: max(100%, 380px); padding-top: calc(4px / .23); }
  body[data-step="2"] .item .r, body[data-step="2"] .item .x { display: none; }
  body[data-step="2"] .item .k { font-size: calc(8px / .23); }
  body[data-step="2"] .item h2 { font-size: calc(9px / .23); line-height: 1.15; margin: calc(1px / .23) 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item { cursor: pointer; }
  /* Coloured cards: a panel behind image and caption, drawn as spread shadows so the layout stays put */
  .item[data-cat] { --pad: 12px; }
  .item[data-cat="Ausstellungen"] { --bg: var(--yellow); }  .item[data-cat="Programm"] { --bg: var(--peach); }
  .item[data-cat="Sammlung"] { --bg: var(--rose); } /* Besuch: no colour */
  .item[data-cat="Museum"] { --bg: var(--sky); }            .item[data-cat="Forschung"] { --bg: var(--blue); }
  .item[data-cat="Engagement"] { --bg: var(--pink); }       .item[data-cat="Vermietung"] { --bg: var(--mint); }
  .item[data-cat="Info"] { --bg: var(--lilac); }
  .item[data-cat] .tilt, .item[data-cat] .txt { background: var(--bg); box-shadow: 0 0 0 var(--pad) var(--bg); }
  .item[data-cat] .txt { padding-left: 0; padding-right: 0; }
  .item.complete[data-cat] .tilt, .item.complete[data-cat] .txt { background: var(--white); box-shadow: none; } /* framed cards stay uncoloured */
  .item.complete[data-cat] .txt { padding: 10px 12px 12px; }
  /* Zoomed out (provisional): colour behind the image only, captions on the page */
  body[data-step="2"] .item[data-cat] { --pad: calc(3px / .23); }
  body[data-step="2"] .item[data-cat]:not(.complete) .txt { background: none; box-shadow: none; }
  /* Cards that open: a + after the title */
  .item:not(.complete) h2 { position: relative; padding-right: 1.2em; }
  .item:not(.complete) h2::after { content: '+'; position: absolute; right: 0; top: 0; }
  /* Complete cards: framed like the navigation, image on top, the content itself below */
  .item.complete { cursor: default; }
  .item.complete .tilt { height: auto; border: 1px solid var(--black); border-radius: 4px; background: var(--white); overflow: hidden; }
  .item.complete .txt { position: static; width: 100%; padding: 10px 12px 12px; border-top: 1px solid var(--black); }
  .item .social { display: none; }
  .item.complete:has(.social) .txt { border-top: 0; }
  .item .facts.links a { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--black); cursor: pointer; }
  .item .facts.links a:last-child { border-bottom: 1px solid var(--black); }
  .item .facts.links a:hover { opacity: .5; }
  .item .facts.links img { width: 16px; height: 16px; object-fit: contain; background: none; }
  .item .facts { margin-top: 8px; font-size: 12px; line-height: 1.4; }
  .item .facts div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--black); }
  .item .facts div:last-child { border-bottom: 1px solid var(--black); }
  .item .cta { display: block; width: 100%; height: 40px; border: 0; border-top: 1px solid var(--black); background: none; color: inherit;
    font: 12px/1 var(--font); letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  .item .cta:hover { background: var(--black); color: var(--white); }
  body[data-step="2"] .item .facts, body[data-step="2"] .item .cta { display: none; }
  body[data-step="2"] .item.complete .txt { width: 100%; }
  body[data-step="2"] .item h2::after { display: none; } /* the frame carries the difference when zoomed out */

  /* Overlaid navigation, top left: logo row over the search bar, panels open below */
  .nav { position: fixed; top: 29px; left: 27px; z-index: 2; width: 428px; max-width: calc(100% - 32px);
    background: var(--white); border: 1px solid var(--black); border-radius: 4px; overflow: hidden;
    font: 20px/28px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0; }
  .logo { display: grid; justify-items: center; align-items: start; width: 100%; height: 128px; padding: 38px 0 0; border: 0; border-bottom: 1px solid var(--black);
    background: none; cursor: pointer; }
  .logo img { display: block; }
  .bar { display: flex; height: 48px; }
  .bar > * { border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  .bar input { flex: 1; min-width: 0; padding: 0 0 0 21px; outline: none; }
  .bar input::-webkit-search-cancel-button { display: none; }
  /* Clear: a × from the typeface, only while there is text */
  .bar .clear { width: auto; padding: 0 21px 0 12px; border-left: 0; }
  .bar .clear:hover:not(:disabled) { background: none; color: inherit; }
  .bar input:placeholder-shown + .clear { display: none; }
  .bar input::placeholder { color: var(--black); opacity: .45; }
  .bar button { width: 50px; flex: none; border-left: 1px solid var(--black); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .bar button:hover:not(:disabled), .panel a:hover, .panel button:hover { background: var(--black); color: var(--white); }
  .bar button:hover:not(:disabled) img { filter: invert(1); }
  .bar button:disabled { cursor: default; }
  .bar button:disabled img { opacity: .25; }
  .bar img { display: block; }
  .panel { border-top: 1px solid var(--black); max-height: calc(100vh - 29px - 178px - 27px); overflow-y: auto; }
  .panel[hidden] { display: none; }
  .panel a, .panel button { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 49px; padding: 0 21px;
    border: 0; border-bottom: 1px solid var(--black); background: none; color: inherit; font: inherit; letter-spacing: inherit;
    text-transform: inherit; text-align: left; cursor: pointer; }
  .panel > :last-child { border-bottom: 0; }
  .panel .on { background: var(--black); color: var(--white); }
  .panel span { opacity: .45; }
  /* Language row: DE / EN, active one black, the other faded (visual only for now) */
  .panel .head { display: flex; align-items: center; height: 49px; padding: 0 21px; border-bottom: 1px solid var(--black); opacity: .45; }
  .panel .sections > :last-child { border-bottom-width: 2px; } /* 2px line sets the language row apart */
  .panel .lang { display: flex; justify-content: space-between; align-items: center; height: 49px; padding: 0 21px; }
  .panel .lang i { display: flex; gap: 0 .3em; font-style: normal; }
  .panel .lang button { width: auto; height: auto; padding: 0; border: 0; opacity: .45; }
  .panel .lang button:hover { background: none; color: inherit; opacity: 1; }
  .panel .lang button.on { background: none; color: inherit; opacity: 1; cursor: default; }
  @media (max-width: 460px) { .nav { top: 16px; left: 16px; } }
  .count { position: fixed; left: 10px; bottom: 10px; padding: 2px 4px; background: var(--white); color: rgba(23, 23, 23, .5); pointer-events: none; }
</style>
</head>
<body data-step="0">
<div class="view"><div class="field"></div></div>
<div class="nav">
  <button class="logo" aria-label="Zur Startansicht"><img src="nav/logo.svg" width="206" height="55.1" alt="Leopold Museum"></button>
  <div class="bar">
    <input type="search" placeholder="Suchen" aria-label="Suchen">
    <button class="clear" aria-label="Suche löschen">×</button>
    <button class="zout" aria-label="Zoom out"><img src="nav/minus.svg" width="20" height="1" alt=""></button>
    <button class="zin" aria-label="Zoom in"><img src="nav/plus.svg" width="20" height="20" alt=""></button>
    <button class="tmenu" aria-label="Menu"><img src="nav/menu.svg" width="24" height="8" alt=""></button>
  </div>
  <div class="panel suggest" hidden></div>
  <div class="panel menu" hidden>
    <div class="sections"></div>
    <div class="lang">Sprache <i><button class="on" aria-pressed="true">DE</button><span>/</span><button aria-pressed="false">EN</button></i></div>
  </div>
</div>
<div class="count"></div>
<script type="module">
const CELL = 480, STEPS = [1.4, 1, 0.23]; // cell pitch at scale 1 (css px), scale per zoom step
const view = document.querySelector('.view'), field = document.querySelector('.field');
const zin = document.querySelector('.zin'), zout = document.querySelector('.zout');
// Site content, current exhibitions and programme first so they take the centre.
const CATS = ['Ausstellungen', 'Programm', 'Besuch', 'Sammlung', 'Museum', 'Forschung', 'Engagement', 'Vermietung', 'Info'];
// Not from the scrape: the museum's social channels (links from the site's footer, 2026-10-05).
const SOCIAL = { cat: 'Info', kicker: '', title: 'Social Media', when: '', r: 1.5, social: [
  ['instagram', 'Instagram', 'https://www.instagram.com/leopold_museum'], ['facebook', 'Facebook', 'https://www.facebook.com/LeopoldMuseum'],
  ['youtube', 'YouTube', 'https://www.youtube.com/user/LeopoldMuseumWien'], ['pinterest', 'Pinterest', 'https://www.pinterest.com/leopoldmuseum/']] };
const works = [...await (await fetch('items.json')).json(), SOCIAL].sort((a, b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat));

// Field: a square of cells, odd columns dropped half a cell, small fixed jitter per cell.
const COLS = Math.ceil(Math.sqrt(works.length)), ROWS = Math.ceil(works.length / COLS) + 1;
let seed = 1918; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cells = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
  cells.push({ x: c * CELL + (rnd() - .5) * CELL * .1, y: r * CELL + (c % 2) * CELL / 2 + (rnd() - .5) * CELL * .1 });
const FW = COLS * CELL, FH = ROWS * CELL + CELL / 2;
// Cells nearest the centre first, so a filtered set gathers in the middle.
const order = cells.map((c, i) => i).sort((a, b) =>
  Math.hypot(cells[a].x + CELL / 2 - FW / 2, cells[a].y + CELL / 2 - FH / 2) - Math.hypot(cells[b].x + CELL / 2 - FW / 2, cells[b].y + CELL / 2 - FH / 2));

// Complete cards: shown in full on the canvas, nothing to open. Sample content typed in from the museum's
// pages (2026-10-05) until the scrape carries it; cta = a button that will open an overlay.
const FRAME = CELL * .8; // max height of a complete card's frame
const COMPLETE = {
  'AKTUELLE ÖFFNUNGSZEITEN': { rows: [['Mittwoch – Montag', '10–18 Uhr'], ['Dienstag', 'geschlossen'], ['Feiertage', 'geöffnet'], ['Letzter Einlass', '17:30 Uhr']] },
  'Social Media': {},
  'TICKETS': { rows: [['Regulär', 'EUR 19,00'], ['Ermäßigt', 'EUR 16,00'], ['Unter 19 Jahren', 'EUR 2,50'], ['Unter 7 Jahren', 'EUR 0,00']], cta: 'Tickets kaufen' },
};
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const items = works.map(w => {
  // Equal area per item, uncropped; room left below for the text.
  const s = CELL * .6, k = Math.min(1, CELL * .66 / (s * Math.max(Math.sqrt(w.r), 1 / Math.sqrt(w.r))));
  let wd = s * Math.sqrt(w.r) * k, ht = wd / w.r;
  const el = document.createElement('div'); el.className = 'item';
  el.dataset.cat = w.cat; // section colour
  el.style.width = wd + 'px'; el.style.height = ht + 'px';
  const img = document.createElement(w.img ? 'img' : 'div');
  if (w.img) { img.alt = w.title; img.decoding = 'async'; img.draggable = false; }
  else if (w.social) { img.className = 'social'; ht = 0; el.style.height = '0px'; } // no picture: caption and one row per channel
  else { img.className = 'card'; img.textContent = w.title; }
  const when = w.when + (w.more ? ` (+${w.more} Termine)` : '');
  const txt = document.createElement('div'); txt.className = 'txt';
  const rest = [w.kicker, when].filter(Boolean).join(' · ');
  const full = COMPLETE[w.title];
  txt.innerHTML = `<div class="k"><span class="c">${esc(w.cat)}</span><span class="r">${rest ? ' · ' + esc(rest) : ''}</span></div><h2>${esc(w.title)}</h2>` +
    (w.social ? `<div class="facts links">${w.social.map(([k, name, url]) => `<a href="${url}" target="_blank"><img src="social/${k}.svg" alt="" draggable="false">${esc(name)}</a>`).join('')}</div>`
     : full ? `<div class="facts">${(full.rows ?? []).map(([a, b]) => `<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}</div>`
          : `<div class="x">${esc(w.sub || w.text)}</div>`);
  const tilt = document.createElement('div'); tilt.className = 'tilt';
  tilt.append(img, txt); el.append(tilt); field.append(el);
  if (full) {
    el.classList.add('complete'); img.style.height = ht + 'px';
    if (full.cta) tilt.insertAdjacentHTML('beforeend', `<button class="cta">${esc(full.cta)}</button>`);
    // The whole frame (image + content + button) fits the height a picture card and its caption use,
    // so it clears the card below: the image shrinks to make room (twice, as the text may rewrap).
    for (let i = 0; i < 2; i++) {
      const extra = tilt.offsetHeight - ht; if (ht + extra <= FRAME) break;
      ht = FRAME - extra; wd = ht * w.r;
      el.style.width = wd + 'px'; el.style.height = ht + 'px'; img.style.height = ht + 'px';
    }
  }
  return { w, el, img, wd, ht, fh: full ? el.firstChild.offsetHeight : 0, x: 0, y: 0, res: 0 };
});

let step = 0, scale = STEPS[0], px = 0, py = 0;
function apply(ease) {
  field.classList.toggle('ease', !!ease);
  field.style.transform = `translate(${px}px, ${py}px) scale(${scale})`;
  document.body.dataset.step = step;
  zin.disabled = step === 0; zout.disabled = step === STEPS.length - 1;
  clearTimeout(apply.t); apply.t = setTimeout(load, ease ? 650 : 120);
}
// Load only what is on screen: museum preview when small, the larger file at the closest step.
function load() {
  const m = 400 / scale, x0 = -px / scale - m, y0 = -py / scale - m, x1 = x0 + innerWidth / scale + 2 * m, y1 = y0 + innerHeight / scale + 2 * m;
  for (const it of items) {
    if (it.el.hidden || it.x + it.wd < x0 || it.x > x1 || it.y + it.ht < y0 || it.y > y1) continue;
    if (!it.res && it.w.img) { it.img.src = it.w.img; it.res = 1; }
  }
}
function zoomTo(s, ax = innerWidth / 2, ay = innerHeight / 2) {
  s = Math.max(0, Math.min(STEPS.length - 1, s)); if (s === step) return;
  const k = STEPS[s] / scale; px = ax - (ax - px) * k; py = ay - (ay - py) * k;
  step = s; scale = STEPS[s]; clamp(); apply(true);
}
function centreOn(x, y) { px = innerWidth / 2 - x * scale; py = innerHeight / 2 - y * scale; clamp(); }
function clamp() {
  px = Math.min(innerWidth / 2, Math.max(innerWidth / 2 - FW * scale, px));
  py = Math.min(innerHeight / 2, Math.max(innerHeight / 2 - FH * scale, py));
}

// Search + filter: matching works take the cells nearest the centre.
let query = '', artist = '';
function layout() {
  const q = query.toLowerCase();
  let n = 0;
  for (const it of items) {
    const on = (!artist || it.w.cat === artist) && (!q || [it.w.cat, it.w.kicker, it.w.title, it.w.sub, it.w.text, it.w.when].join(' ').toLowerCase().includes(q));
    it.el.hidden = !on; if (!on) continue;
    const c = cells[order[n++]];
    // Picture cards centre their image in the top 72% of the cell (caption below); frames sit near the top.
    it.x = c.x + (CELL - it.wd) / 2; it.y = c.y + (it.fh ? (CELL * .86 - it.fh) / 2 : (CELL * .72 - it.ht) / 2);
    it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
  }
  document.querySelector('.count').textContent = n + ' / ' + works.length;
  // Centre the view on what is showing (captions included), not on the field.
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of items) if (!it.el.hidden) {
    x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y);
    x1 = Math.max(x1, it.x + it.wd); y1 = Math.max(y1, it.y + it.ht + (txtOf(it)?.offsetHeight ?? 0));
  }
  // Nothing searched or filtered: back to the opening view (closest step, PREMIERE! centred).
  if (!q && !artist && home) { step = 0; scale = STEPS[0]; centreOn(home.x + home.wd / 2, home.y + (home.ht + txtOf(home).offsetHeight) / 2); }
  else if (n) centreOn((x0 + x1) / 2, (y0 + y1) / 2); else centreOn(FW / 2, FH / 2);
  apply(true);
}

const txtOf = it => it.el.querySelector('.txt');
// The opening view centres on the current exhibition PREMIERE!, image and text.
const home = items.find(it => it.w.cat === 'Ausstellungen' && it.w.title === 'PREMIERE!');
// Hover: the card (image + text) tips subtly toward the cursor in 3D.
const SKEW = 6; // max degrees
let tipped = null;
view.addEventListener('pointermove', e => {
  const el = !drag && e.pointerType === 'mouse' ? e.target.closest?.('.item') : null;
  if (tipped && tipped !== el) { tipped.firstChild.style.transform = ''; tipped = null; }
  if (!el) return;
  const r = el.firstChild.getBoundingClientRect(), u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5;
  el.firstChild.style.transform = `perspective(900px) rotateX(${-v * 2 * SKEW}deg) rotateY(${u * 2 * SKEW}deg)`;
  tipped = el;
});
view.addEventListener('pointerleave', () => { if (tipped) { tipped.firstChild.style.transform = ''; tipped = null; } });

// Drag to pan; a click without movement opens the item at any zoom step.
let drag = null;
view.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, px, py, moved: 0 }; view.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
  if (drag.moved < 4) return;
  view.classList.add('dragging');
  px = drag.px + e.clientX - drag.x; py = drag.py + e.clientY - drag.y; clamp(); apply(false);
});
view.addEventListener('pointerup', e => {
  const d = drag; drag = null; view.classList.remove('dragging');
  if (!d || d.moved >= 4) return;
  view.releasePointerCapture(e.pointerId);
  const at = document.elementsFromPoint(e.clientX, e.clientY);
  if (at.some(el => el.matches?.('.cta'))) return; // the overlay comes later
  const link = at.find(el => el.matches?.('.links a')); if (link) { open(link.href, '_blank'); return; }
  const hit = at.map(el => el.closest?.('.item')).find(Boolean);
  const it = hit && items.find(i => i.el === hit); if (!it || hit.classList.contains('complete')) return;
  open(it.w.url, '_blank');
});
// Wheel / trackpad: one zoom step per gesture, anchored at the cursor.
let acc = 0, lock = 0;
view.addEventListener('wheel', e => {
  e.preventDefault(); if (performance.now() < lock) return;
  acc += e.deltaY; if (Math.abs(acc) < 40) return;
  zoomTo(step + Math.sign(acc), e.clientX, e.clientY); acc = 0; lock = performance.now() + 700;
}, { passive: false });
zin.onclick = () => zoomTo(step - 1);
zout.onclick = () => zoomTo(step + 1);

// Navigation panels
const pm = document.querySelector('.panel.menu'), sections = pm.querySelector('.sections');
const counts = {}; works.forEach(w => { counts[w.cat] = (counts[w.cat] || 0) + 1; });
sections.innerHTML = CATS.filter(c => counts[c]).map(c => `<button data-a="${c}">${c} <span>(${counts[c]})</span></button>`).join('');
// Menu sections show their cards; clicking the active one again shows everything (and returns to PREMIERE!).
sections.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  // Picking a section clears the search, so the two never combine into an empty field.
  // The section's name shows in the field (as a label: it filters by section, not by text).
  query = ''; setFilter(b.dataset.a === artist ? '' : b.dataset.a); document.querySelector('.bar input').value = artist;
  pm.hidden = true; // close, so the panel doesn't cover the result
  layout();
};
const ps = document.querySelector('.panel.suggest'), input = document.querySelector('.bar input');
const setFilter = a => { artist = a; sections.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.a === a)); };
// Language: switches the highlight only; the content is German either way for now.
const lang = document.querySelector('.lang');
lang.onclick = e => { const b = e.target.closest('button'); if (!b) return;
  lang.querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); };
document.querySelector('.tmenu').onclick = () => { pm.hidden = !pm.hidden; ps.hidden = true; };
// Search always covers everything: typing resets the filter to all.
input.addEventListener('input', e => {
  query = e.target.value.trim(); ps.hidden = !!query;
  // Typing over a section's name, or clearing it, drops the section too.
  if (artist) setFilter('');
  layout();
});
// Suggestions on focus: what most visitors look for. q = search term, cat = optional filter with it.
const SUGGEST = [
  ['Tickets', 'Tickets'], ['Öffnungszeiten', 'Öffnungszeiten'], ['Aktuelle Ausstellungen', 'aktuell', 'Ausstellungen'],
  ['Demnächst', 'vorschau', 'Ausstellungen'], ['Führungen', 'Führung'], ['Für Kinder', 'Kinder'], ['Anreise', 'Anreise'],
  ['Café', 'Café'], ['Shop', 'Shop'], ['Barrierefreiheit', 'Barrierefrei'], ['Kontakt', 'Kontakt'],
];
ps.innerHTML = '<div class="head">Häufig gesucht</div>' + SUGGEST.map(([l], i) => `<button data-i="${i}">${l}</button>`).join('');
ps.addEventListener('pointerdown', e => e.preventDefault()); // keep focus so the click lands before blur
ps.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const [, q, cat = ''] = SUGGEST[b.dataset.i];
  input.value = query = q; setFilter(cat); ps.hidden = true; input.blur(); layout();
};
const clear = document.querySelector('.clear');
clear.addEventListener('pointerdown', e => e.preventDefault()); // keep focus in the field
clear.onclick = () => { input.value = ''; input.dispatchEvent(new Event('input')); input.focus(); };
input.addEventListener('focus', () => { if (!input.value) { ps.hidden = false; pm.hidden = true; } else if (artist && !query) input.select(); }); // a section name is replaced by typing
input.addEventListener('blur', () => { ps.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape') { pm.hidden = ps.hidden = true; } });
addEventListener('resize', () => { clamp(); apply(false); });

layout(); apply(false); // open on the opening view without easing in
// Logo: back to the opening view — search and filter cleared, panels shut.
document.querySelector('.logo').onclick = () => {
  query = ''; input.value = ''; setFilter(''); pm.hidden = ps.hidden = true; layout();
};
</script>
</body>
</html>
