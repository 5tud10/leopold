<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Leopold Museum · Designvorschläge</title>
<style>
  /* Übersicht der Designvorschläge: Logo und fünf Ziffern, sonst nichts */
  @font-face { font-family: "Bureau"; src: url("v1/assets/fonts/STKBureauSansVariable-Regular.woff2") format("woff2"); font-weight: 150 700; font-display: swap; }
  :root { --ink: #111; --mid: #8a8a8a; --pale: #c4c4c4; --ease: cubic-bezier(.2, .7, .2, 1); }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Bureau", ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: #fff; min-height: 100svh; display: grid; grid-template-rows: 88px 1fr 88px; justify-items: center; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; }
  header img { width: 104px; height: auto; display: block; }
  nav { align-self: center; display: flex; gap: clamp(28px, 6vw, 96px); }
  nav a { font-size: clamp(40px, 7vw, 108px); font-weight: 300; line-height: 1; letter-spacing: -.05em; font-variant-numeric: lining-nums; color: var(--ink); text-decoration: none; transition: color .4s var(--ease); }
  nav:hover a, nav:focus-within a { color: var(--pale); }
  nav a:hover, nav a:focus-visible { color: var(--ink); outline: 0; }
</style>
</head>
<body>
<header><img src="v1/assets/logo.svg" alt="Leopold Museum" width="285" height="76"></header>
<!-- Ordner: 1 = v1, 2 = v8, 3 = v9, 4 = v2, 5 = v15 -->

  <a href="v15/index.html" aria-label="Vorschlag 5">5</a>
</nav>
<span></span>
</body>
</html>
