<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leopold Room</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.over canvas { cursor: pointer; }
  /* The gradient: the room dissolves into white towards the window edges. */
  .fade { position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 18vmin 9vmin var(--white); }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; }
  body:not(.over) .caption { visibility: hidden; }
</style>
</head>
<body>
<canvas></canvas>
<div class="fade"></div>
<nav><a href="../">Leopold</a></nav>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const CELL = 1.6;                    // grid cell, world units
const COLS = 10, ROWS = 6, DEPTH = 9; // back wall COLS×ROWS cells, side walls DEPTH cells deep
const W = COLS * CELL, H = ROWS * CELL, D = DEPTH * CELL;
const FILL = 0.5;                    // share of cells covered by a picture
const SLIDES = 0.22;                 // share of pictures that run a slideshow
const SIZES = [[2, 2], [2, 1], [1, 2], [1, 1], [1, 1], [1, 1]];

const works = await (await fetch('works.json')).json();
const canvas = document.querySelector('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setClearColor(0xf9f9f9);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
const EYE = new THREE.Vector3(0, 0, H * 1.45 - D);  // distance from the back wall, measured from the reference

const loader = new THREE.TextureLoader();
const textures = works.map(w => {
  const t = loader.load(w.src);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
});

// Cover-crop: scale/offset the uv so the work fills the tile without stretching.
function crop(work, aspect) {
  const a = work.w / work.h;
  return a > aspect ? new THREE.Vector4(aspect / a, 1, (1 - aspect / a) / 2, 0)
                    : new THREE.Vector4(1, a / aspect, 0, (1 - a / aspect) / 2);
}
const material = (i, aspect) => new THREE.ShaderMaterial({
  uniforms: { uMap: { value: textures[i] }, uCrop: { value: crop(works[i], aspect) } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D uMap; uniform vec4 uCrop; varying vec2 vUv;
    void main() {
      gl_FragColor = texture2D(uMap, vUv * uCrop.xy + uCrop.zw);
      #include <colorspace_fragment>
    }`,
});

// Each face: origin, the world direction of its columns and rows, its size in cells.
const faces = [
  { o: [-W / 2, -H / 2, -D], u: [1, 0, 0], v: [0, 1, 0], cols: COLS, rows: ROWS },   // back
  { o: [-W / 2, -H / 2, 0], u: [0, 0, -1], v: [0, 1, 0], cols: DEPTH, rows: ROWS },  // left
  { o: [W / 2, -H / 2, -D], u: [0, 0, 1], v: [0, 1, 0], cols: DEPTH, rows: ROWS },   // right
  { o: [-W / 2, -H / 2, 0], u: [1, 0, 0], v: [0, 0, -1], cols: COLS, rows: DEPTH },  // floor
  { o: [-W / 2, H / 2, -D], u: [1, 0, 0], v: [0, 0, 1], cols: COLS, rows: DEPTH },   // ceiling
];

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let deck = [];
const draw = () => (deck.length ? deck : (deck = shuffle(works.map((_, i) => i)))).pop();

const tiles = [];
for (const f of faces) {
  const used = new Set(), key = (c, r) => c + ',' + r;
  let covered = 0;
  const cells = shuffle([...Array(f.cols * f.rows)].map((_, i) => [i % f.cols, i / f.cols | 0]));
  for (const [c, r] of cells) {
    if (covered >= FILL * f.cols * f.rows) break;
    const [sc, sr] = SIZES[Math.random() * SIZES.length | 0];
    const span = [];
    for (let dc = 0; dc < sc; dc++) for (let dr = 0; dr < sr; dr++) span.push([c + dc, r + dr]);
    if (span.some(([x, y]) => x >= f.cols || y >= f.rows || used.has(key(x, y)))) continue;
    span.forEach(([x, y]) => used.add(key(x, y)));
    covered += sc * sr;

    const u = new THREE.Vector3(...f.u), v = new THREE.Vector3(...f.v);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(sc * CELL, sr * CELL));
    mesh.position.set(...f.o).addScaledVector(u, (c + sc / 2) * CELL).addScaledVector(v, (r + sr / 2) * CELL);
    mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(u, v, new THREE.Vector3().crossVectors(u, v)));
    const n = Math.random() < SLIDES ? 4 : 1;
    const tile = { mesh, aspect: sc / sr, list: [...Array(n)].map(draw), at: 0,
      period: 1.4 + Math.random() * 1.6, next: 0 };
    tile.next = Math.random() * tile.period;
    mesh.material = material(tile.list[0], tile.aspect);
    mesh.userData.tile = tile;
    scene.add(mesh);
    tiles.push(tile);
  }
}
const slideshows = tiles.filter(t => t.list.length > 1);

// Hard cuts, like a slideshow — each on its own clock.
function advance(t, time) {
  t.at = (t.at + 1) % t.list.length;
  t.next = time + t.period;
  const m = t.mesh.material.uniforms, i = t.list[t.at];
  m.uMap.value = textures[i];
  m.uCrop.value = crop(works[i], t.aspect);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// The camera leans towards the cursor; the room swings around it.
const mouse = new THREE.Vector2(), look = new THREE.Vector2();
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let over = null;
addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2);
  ndc.copy(mouse);
});
canvas.addEventListener('click', () => over && open(works[over.list[over.at]].url, '_blank'));
const cap = ['t', 'a', 'd'].map(c => document.querySelector('.caption .' + c));

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();
  for (const t of slideshows) if (time >= t.next) advance(t, time);

  look.lerp(mouse, 0.05);
  camera.position.set(EYE.x + look.x * CELL * 1.6, EYE.y + look.y * CELL, EYE.z);
  camera.lookAt(look.x * CELL * 1.2, look.y * CELL * 0.8, -D);

  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(scene.children)[0];
  over = hit ? hit.object.userData.tile : null;
  document.body.classList.toggle('over', !!over);
  if (over) {
    const w = works[over.list[over.at]];
    [w.title, w.artist, w.date].forEach((s, i) => cap[i].textContent = s);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
